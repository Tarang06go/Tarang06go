name: Contribution snake
on:
  push:
    branches: [main]
    paths: ['.github/workflows/contribution-snake.yml', 'scripts/activity.py']
  schedule:
    - cron: '27 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contribution-snake.svg?color_snake=#00885d&color_dots=#dedbd7,#3c52ff,#9625ff,#ff228d,#ff8c00
      - name: Add warm off-white canvas
        shell: python
        run: |
          from pathlib import Path
          from xml.etree import ElementTree
          path = Path('dist/contribution-snake.svg')
          svg = path.read_text(encoding='utf-8')
          x, y, width, height = ElementTree.fromstring(svg).attrib['viewBox'].split()
          background = f'<rect x="{x}" y="{y}" width="{width}" height="{height}" rx="12" fill="#FAF8F3" stroke="#B8B3AE"/>'
          start = svg.index('>', svg.index('<svg')) + 1
          path.write_text(svg[:start] + background + svg[start:], encoding='utf-8')
      - uses: actions/upload-artifact@v4
        with:
          name: snake
          path: dist/contribution-snake.svg
  publish:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: snake
          path: assets
      - name: Render portfolio statistics
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/activity.py
      - name: Publish refreshed artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/contribution-snake.svg assets/folio/activity.svg assets/folio/languages.svg assets/folio/streak.svg assets/folio/weekly.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh contribution snake'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
